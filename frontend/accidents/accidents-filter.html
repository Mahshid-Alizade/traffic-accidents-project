</head>

<body>

    <aside class="sidebar">

        <h2>Traffic Accidents</h2>

        <a href="../index.html">
            <i class="fa-solid fa-chart-line"></i>

        </a>

        <div class="submenu">
            <a class="disabled">
                <i class="fa-solid fa-car-burst"></i>
                Accidents

            <div class="submenu-content">
                <a href="accidents-count.html">

        </a>

    </aside>

    <main class="content">

        <h1>Accident Filter</h1>

        <p>
            Count accidents using different filters.
        </p>

        <div class="card accident-filter">

            <label>Year</label>
            <select id="year">
                <option value="" disabled selected>Select a year</option>
                <option value="2016">2016</option>
                <option value="2017">2017</option>
                <option value="2018">2018</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
            </select>

            <label>Month</label>
            <select id="month">
                
                <option value="" disabled selected>This field is optional</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">october</option>
                <option value="11">November</option>
                <option value="12">December</option>

            </select>

            <label>Weekday</label>
            <select id="weekday">
                
                <option value="" disabled selected>This field is optional</option>
                <option value="01">Monday</option>
                <option value="02">Tuesday</option>
                <option value="03">Wednesday</option>
                <option value="04">Thursday</option>
                <option value="05">Friday</option>
                <option value="06">Saturday</option>
                <option value="07">Sunday</option>

            </select>

            <label>State</label>
            <input id="state" type="text" value="" placeholder="This can be the exact AGS region code or Federal state code (first two digits of AGS).">

            <label>Type</label>
            <select id="type">
                <option value="">All</option>
                <option>bicycle</option>
                <option>pedestrian</option>
                <option>car</option>
                <option>motorcycle</option>
            </select>

            <label>Category</label>

            <select id="category">

                <option value="all">
                    All Personal Injury Accidents
                </option>

                <option value="1">
                    Fatal Accidents
                </option>

                <option value="2">
                    Serious Injury
                </option>

                <option value="3">
                    Slight Injury
                </option>

            </select>

            <label>Limit</label>
            <input type="number" value="10" id="limit">

            <button onclick="filterAccident()">Search</button>

            <table id="result-table">

                <tr>
                    <th>ID</th>
                    <th>Year</th>
                    <th>Month</th>
                    <th>Weekday</th>
                    <th>Hour</th>
                    <th>Severity</th>
                    <th>Type</th>
                    <th>Region (AGS)</th>
                </tr>
                

            </table>
        
        </div>

    </main>

    <script src="../js/config.js"></script>
    <script src="../js/accidents.js"></script>
    <script src="../js/sidebar.js"></script>

</body>

</html>
