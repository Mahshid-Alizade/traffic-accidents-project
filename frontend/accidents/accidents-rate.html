<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accident Rate</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/accidents.css">
    <link rel="icon" type="image/png" href="../favicon.png">
</head>

<body>

    <aside class="sidebar">

        <h2>Traffic Accidents</h2>
        <p>Integraion Platform</p>

        <a href="../index.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <div class="submenu">
            <a class="disabled">
                <i class="fa-solid fa-car-burst"></i>
                Accidents
            </a>    
            
            <div class="submenu-content">
                <a href="accidents-count.html">
                    Accident Counter
                </a>
                <a href="accidents-rate.html">
                    Accident Rate
                </a>
                <a href="accidents-filter.html">
                    Accident Filter
                </a>
                <a href="accidents-first-year.html">
                    First year
                </a>
            </div>
        </div>

        <a href="../population.html">
            <i class="fa-solid fa-users"></i>
            Population
        </a>

        <a href="../regions.html">
            <i class="fa-solid fa-map-location-dot"></i>
            Regions
        </a>

        <a href="../metadata.html">
            <i class="fa-solid fa-database"></i>
            Metadata
        </a>

        <a href="../trend.html">
            <i class="fa-solid fa-chart-line"></i>
            Trend Chart
        </a>

    </aside>

    <main class="content">

        <h1>Accident Rate</h1>

        <p>
            Count accidents using different filters.
        </p>

        <div class="card accident-rate">

            <label>Year</label>

            <select id="year">
                <option value="2016">2016</option>
                <option value="2017">2017</option>
                <option value="2018">2018</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
            </select>

            <label>Type</label>
            <select id="type">

                <option>All</option>
                <option>Bicycle</option>
                <option>Pedestrian</option>
                <option>Car</option>
                <option>Motorcycle</option>

            </select>

            <label>Category</label>
            <select id="category">

                <option value="all">
                    All Personal Injury Accidents
                </option>

                <option value="1">
                    Fatal Accidents
                </option>

                <option value="2">
                    Serious Injury
                </option>

                <option value="3">
                    Slight Injury
                </option>

            </select>

            <label>Sort</label>
            <select id="sort">

                <option>Highest</option>
                <option>Lowest</option>

            </select>

            <label>Limit</label>
            <input type="number" value="10" id="limit">

            <button onclick="rateAccidents()">
                Calculate Rates
            </button>

            
            <table id="result-table">
                <tr>
                    <th>ID</th>
                    <th>Region</th>
                    <th>Accidents</th>
                    <th>Population</th>
                    <th>Category</th>
                    <th>Rate / 100k</th>
                </tr>
            </table>

        </div>



    </main>

    <script src="../js/config.js"></script>
    <script src="../js/accidents.js"></script>
    <script src="../js/sidebar.js"></script>

</body>

</html>
