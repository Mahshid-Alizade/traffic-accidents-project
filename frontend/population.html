<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Population Explorer</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link
        rel="stylesheet"
        href="css/style.css">
    <link rel="icon" type="image/png" href="./favicon.png">
</head>

<body>

    <aside class="sidebar">

        <h2>Traffic Accidents</h2>
        <p>Integraion Platform</p>

        <a href="index.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <div class="submenu">
            <a class="disabled">
                <i class="fa-solid fa-car-burst"></i>
                Accidents
            </a>    
            
            <div class="submenu-content">
                <a href="./accidents/accidents-count.html">
                    Accident Counter
                </a>
                <a href="./accidents/accidents-rate.html">
                    Accident Rate
                </a>
                <a href="./accidents/accidents-filter.html">
                    Accident Filter
                </a>
                <a href="./accidents/accidents-first-year.html">
                    First year
                </a>
            </div>
        </div>

        <a href="population.html">
            <i class="fa-solid fa-users"></i>
            Population
        </a>

        <a href="regions.html">
            <i class="fa-solid fa-map-location-dot"></i>
            Regions
        </a>

        <a href="metadata.html">
            <i class="fa-solid fa-database"></i>
            Metadata
        </a>

        <a href="trend.html">
            <i class="fa-solid fa-chart-line"></i>
            Trend Chart
        </a>

    </aside>

    <main class="content">

        <h1>Population Explorer</h1>

        <p>
            Explore population statistics by region and year.
        </p>

        <div class="card">

            <label>Year</label>

            <select id="year">
                <option value="2016">2016</option>
                <option value="2017">2017</option>
                <option value="2018">2018</option>
                <option value="2019">2019</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
            </select>

            <label>State Code</label>

            <input
                id="state"
                placeholder="This can be the exact AGS region code or Federal state code (first two digits of AGS) or the region name.">

            <button onclick="loadPopulation()">
                Search Population
            </button>

        </div>

        <table id="result-table" style="display: none;">
            <thead>
                <tr>
                    <th>Region</th>
                    <th>State</th>
                    <th>Year</th>
                    <th>Population</th>
                </tr>
            </thead>

            <tbody id="results-body">
                <tr>
                    <td colspan="3">
                        No data loaded yet
                    </td>
                </tr>
            </tbody>
        </table>


    </main>

    <script src="js/config.js"></script>
    <script src="js/population.js"></script>
    <script src="js/sidebar.js"></script>

</body>

</html>
