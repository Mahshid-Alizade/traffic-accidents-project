<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Region Explorer</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="./favicon.png">
</head>

<body>

    <aside class="sidebar">

        <h2>Traffic Accidents</h2>
        <p>Integraion Platform</p>

        <a href="index.html">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <div class="submenu">
            <a class="disabled">
                <i class="fa-solid fa-car-burst"></i>
                Accidents
            </a>    
            
            <div class="submenu-content">
                <a href="./accidents/accidents-count.html">
                    Accident Counter
                </a>
                <a href="./accidents/accidents-rate.html">
                    Accident Rate
                </a>
                <a href="./accidents/accidents-filter.html">
                    Accident Filter
                </a>
                <a href="./accidents/accidents-first-year.html">
                    First year
                </a>
            </div>
        </div>

        <a href="population.html">
            <i class="fa-solid fa-users"></i>
            Population
        </a>

        <a href="regions.html">
            <i class="fa-solid fa-map-location-dot"></i>
            Regions
        </a>

        <a href="metadata.html">
            <i class="fa-solid fa-database"></i>
            Metadata
        </a>

        <a href="trend.html">
            <i class="fa-solid fa-chart-line"></i>
            Trend Chart
        </a>

    </aside>

    <main class="content">

        <h1>Region Explorer</h1>

        <p>
            Browse regions and AGS codes by state.
        </p>

        <div class="card">

            <label>State</label>

            <input type="text" id="input" placeholder="Search by region name, AGS, or state code...">

            <button onclick="loadRegions()">
                Load Regions
            </button>

        </div>

    
        <table id="result-table" style="display:none;">
            <thead>
                <tr>
                    <th>Region Name</th>
                    <th>AGS</th>
                </tr>
            </thead>

            <tbody id="results-body"></tbody>
        </table>

    </main>

    <script src="js/regions.js"></script>
    <script src="js/sidebar.js"></script>

</body>

</html>
